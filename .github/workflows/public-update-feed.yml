name: Refresh public update feed
on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: public-update-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Publish verified metadata for static CDN clients
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-public-feed.py --publish
